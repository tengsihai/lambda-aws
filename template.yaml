AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda 增删改查后端：四个 Lambda 函数分别负责新增、查询、更新、删除，
  数据存放在已部署的 MySQL 中，数据库口令从 Secrets Manager 获取。

# ---------------------------------------------------------------------------
# 全局默认值：四个函数共享的运行时配置
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    # 四个函数共享同一个依赖层，避免把 PyMySQL、cryptography 重复打包四份
    Layers:
      - !Ref DependenciesLayer
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        # 非敏感的基础设施参数；敏感的数据库口令只通过 DB_SECRET_ARN 间接引用
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_SECRET_ARN: !Ref DbSecretArn
        LOG_LEVEL: !Ref LogLevel
        STAGE: !Ref Stage

Parameters:
  ProjectName:
    Type: String
    Default: lambda-aws
    Description: 项目名，用于拼接资源命名。
    AllowedPattern: '^[a-z][a-z0-9-]*$'

  Stage:
    Type: String
    Default: dev
    Description: 部署环境。
    AllowedValues:
      - dev
      - staging
      - prod

  # ---- 前端跨域来源 ----
  CorsAllowOrigin:
    Type: String
    Default: https://d193yl670roc4e.cloudfront.net
    Description: >
      允许跨域调用 API 的前端源，必须与浏览器里的 Origin 完全一致
      （包含协议，不带末尾斜杠）。本地开发需要额外来源时，可在部署时覆盖。
    AllowedPattern: '^https?://[^/]+$'

  # ---- 数据库（口令本身不在此处出现，只引用其 ARN） ----
  DbHost:
    Type: String
    Description: MySQL 主机名或 IP。
    MinLength: 1

  DbPort:
    Type: Number
    Default: 3306
    Description: MySQL 端口。
    MinValue: 1
    MaxValue: 65535

  DbName:
    Type: String
    Description: MySQL 数据库名。
    MinLength: 1

  DbUser:
    Type: String
    Default: ''
    Description: 数据库用户名；留空时回退到密钥中的 username 字段。

  DbSecretArn:
    Type: String
    Description: Secrets Manager 中数据库凭据的 ARN（JSON，需包含 password）。
    MinLength: 1

  # ---- 函数执行角色（由 terraform-aws 维护，四个函数共用） ----
  # 只传角色名，ARN 在模板里按当前分区和账号拼接，避免写死账号 ID。
  LambdaExecutionRoleName:
    Type: String
    Default: platform-dev-lambda-execution
    Description: >
      四个 Lambda 共享的执行角色名（不是 ARN）。角色需要
      AWSLambdaBasicExecutionRole、AWSLambdaVPCAccessExecutionRole、
      X-Ray 写入权限，以及针对 DbSecretArn 的 secretsmanager:GetSecretValue。
    MinLength: 1

  LogLevel:
    Type: String
    Default: INFO
    Description: 日志级别。
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR

  # ---- VPC（取值来自 terraform-aws 的 state，由流水线自动填充） ----
  # 这两项没有默认值：不在 VPC 里就访问不到私有子网的 MySQL，
  # 因此宁可在部署时报缺参数，也不允许悄悄部署成连不上数据库的形态。
  LambdaVpcSubnetIds:
    Type: String
    Description: >
      逗号分隔的私有子网 ID。由 CI/CD 从 terraform-aws 的 state
      outputs.private_subnet_ids 读取后注入，不需要手工配置。
    MinLength: 1

  LambdaVpcSecurityGroupIds:
    Type: String
    Description: >
      逗号分隔的安全组 ID。由 CI/CD 从 terraform-aws 的 state
      outputs.lambda_security_group_id 读取后注入，不需要手工配置。
    MinLength: 1

Resources:
  # ---------------------------------------------------------------------------
  # 依赖层：四个函数共享的三方依赖
  # 内容由 layer/requirements.txt 构建到 layer 的 python/ 目录下。
  # boto3 不放进层里——Lambda 运行时已自带，额外打包反而会遮蔽运行时版本。
  # ---------------------------------------------------------------------------
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-${Stage}-deps'
      Description: 三方依赖（PyMySQL、cryptography）
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - x86_64
      LicenseInfo: MIT
    Metadata:
      BuildMethod: python3.13

  # ---------------------------------------------------------------------------
  # HTTP API：统一入口，把路由分发到四个函数
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # 浏览器跨域调用需要；AllowOrigins 必须与页面 Origin 完全一致
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 300

  # ---------------------------------------------------------------------------
  # 新增
  # ---------------------------------------------------------------------------
  CreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Stage}-create'
      Description: 新增资源
      CodeUri: src/
      Handler: create.handler.lambda_handler
      # 执行角色由 terraform-aws 统一维护，四个函数共用，本模板不再创建角色。
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}'
      VpcConfig:
        SubnetIds: !Split [',', !Ref LambdaVpcSubnetIds]
        SecurityGroupIds: !Split [',', !Ref LambdaVpcSecurityGroupIds]
      Events:
        CreateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items
            Method: POST

  # ---------------------------------------------------------------------------
  # 查询（单条 + 分页列表共用一个函数）
  # ---------------------------------------------------------------------------
  ReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Stage}-read'
      Description: 查询资源
      CodeUri: src/
      Handler: read.handler.lambda_handler
      # 执行角色由 terraform-aws 统一维护，四个函数共用，本模板不再创建角色。
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}'
      VpcConfig:
        SubnetIds: !Split [',', !Ref LambdaVpcSubnetIds]
        SecurityGroupIds: !Split [',', !Ref LambdaVpcSecurityGroupIds]
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items
            Method: GET
        GetItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items/{id}
            Method: GET

  # ---------------------------------------------------------------------------
  # 更新
  # ---------------------------------------------------------------------------
  UpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Stage}-update'
      Description: 更新资源
      CodeUri: src/
      Handler: update.handler.lambda_handler
      # 执行角色由 terraform-aws 统一维护，四个函数共用，本模板不再创建角色。
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}'
      VpcConfig:
        SubnetIds: !Split [',', !Ref LambdaVpcSubnetIds]
        SecurityGroupIds: !Split [',', !Ref LambdaVpcSecurityGroupIds]
      Events:
        UpdateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items/{id}
            Method: PUT

  # ---------------------------------------------------------------------------
  # 删除
  # ---------------------------------------------------------------------------
  DeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Stage}-delete'
      Description: 删除资源
      CodeUri: src/
      Handler: delete.handler.lambda_handler
      # 执行角色由 terraform-aws 统一维护，四个函数共用，本模板不再创建角色。
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}'
      VpcConfig:
        SubnetIds: !Split [',', !Ref LambdaVpcSubnetIds]
        SecurityGroupIds: !Split [',', !Ref LambdaVpcSecurityGroupIds]
      Events:
        DeleteItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items/{id}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: HTTP API 访问地址。
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  CreateFunctionArn:
    Description: 新增函数 ARN。
    Value: !GetAtt CreateFunction.Arn

  ReadFunctionArn:
    Description: 查询函数 ARN。
    Value: !GetAtt ReadFunction.Arn

  UpdateFunctionArn:
    Description: 更新函数 ARN。
    Value: !GetAtt UpdateFunction.Arn

  DeleteFunctionArn:
    Description: 删除函数 ARN。
    Value: !GetAtt DeleteFunction.Arn

  DependenciesLayerArn:
    Description: 共享依赖层的版本 ARN。
    Value: !Ref DependenciesLayer

  HttpApiId:
    Description: HTTP API 的 ID。
    Value: !Ref HttpApi
