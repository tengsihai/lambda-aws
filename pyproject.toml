[project]
name = "lambda-aws"
version = "0.1.0"
description = "AWS Lambda 增删改查后端（MySQL + Secrets Manager）"
requires-python = ">=3.13"
dependencies = [
    "PyMySQL[rsa]>=1.1.0,<2",
    "boto3>=1.34.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0,<1",
    "mypy>=1.11.0,<2",
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<7",
    "types-PyMySQL>=1.1.0,<2",
    "boto3-stubs[secretsmanager]>=1.34.0",
]

# ---------------------------------------------------------------------------
# Ruff：同时承担 lint 与格式化
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # import 排序
    "N",   # PEP 8 命名约定
    "UP",  # Python 升级建议
    "B",   # bugbear 常见缺陷
    "BLE", # 裸 except（仅 Lambda 入口允许兜底捕获）
    "C4",  # 推导式简化
    "SIM", # 可简化的写法
    "RUF", # ruff 专有规则
    "SLF", # 访问私有成员（测试中用于断言内部缓存状态）
]
ignore = [
    # 本项目注释与文档使用中文，全角标点是刻意为之
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试中的替身类需要沿用 boto3 的异常命名，否则无法模拟 client.exceptions
"tests/*" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["common", "create", "read", "update", "delete"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy：严格模式
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
# 第三方库缺少类型桩时忽略，而不是在业务代码里到处加 ignore
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
